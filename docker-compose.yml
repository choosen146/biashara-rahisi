services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tbms
      POSTGRES_PASSWORD: tbms
      POSTGRES_DB: tbms
    ports: ["5432:5432"]
    volumes: [tbms-postgres:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tbms -d tbms"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  tbms-postgres:
