name: CI
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: {POSTGRES_USER: tbms, POSTGRES_PASSWORD: tbms, POSTGRES_DB: tbms}
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U tbms -d tbms" --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20, cache: npm}
      - run: npm install
      - run: npm run db:generate
      - run: npm run test
        env: {DATABASE_URL: postgresql://tbms:tbms@localhost:5432/tbms?schema=public}
      - run: npm run build
